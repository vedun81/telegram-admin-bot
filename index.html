<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🛠️ Адмін-панель | UkrMova Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 80px;
    color: #eee;
  }
  .container { max-width: 560px; margin: 0 auto; }

  .login-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 32px 24px;
    text-align: center;
    border: 1px solid rgba(255,215,0,0.3);
    margin-top: 50px;
  }
  .login-card h1 { color: #ffd700; margin-bottom: 8px; font-size: 26px; }
  .login-card p { color: #aaa; margin-bottom: 20px; font-size: 13px; }
  .login-card input {
    width: 100%; padding: 14px; border-radius: 50px; border: none;
    font-size: 16px; background: rgba(255,255,255,0.95); margin-bottom: 12px; text-align: center;
  }
  .login-card button {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    border: none; padding: 14px; border-radius: 50px; font-weight: bold;
    font-size: 16px; width: 100%; cursor: pointer;
  }
  .error { color: #ff6b6b; margin-top: 10px; font-size: 13px; min-height: 18px; }

  .main-content { display: none; }
  .header {
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    border-radius: 28px; padding: 16px 20px; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header h1 { color: #ffd700; font-size: 18px; }
  .logout-btn {
    background: rgba(231,76,60,0.8); border: none; padding: 8px 16px;
    border-radius: 50px; color: white; font-size: 12px; cursor: pointer;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: rgba(255,255,255,0.1); border: none; padding: 10px 14px;
    border-radius: 50px; color: #ccc; font-size: 12px; cursor: pointer; flex: 1; min-width: 90px; text-align: center;
  }
  .tab.active { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-weight: bold; }

  .panel { display: none; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 28px; padding: 20px; }
  .panel.active { display: block; }
  .panel h3 { color: #ffd700; margin-bottom: 10px; font-size: 15px; }
  .panel hr { border-color: rgba(255,215,0,0.3); margin: 16px 0; }

  input[type=text], textarea {
    width: 100%; padding: 10px; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.95); margin-bottom: 8px; font-size: 14px;
  }

  .btn { padding: 8px 14px; border-radius: 50px; border: none; font-size: 12px; cursor: pointer; }
  .btn-primary { background: #3498db; color: #fff; }
  .btn-success { background: #2ecc71; color: #fff; }
  .btn-warning { background: #f39c12; color: #1a1a2e; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-full { width: 100%; padding: 12px; font-size: 14px; margin-top: 6px; }

  .question-row { border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 12px; margin-bottom: 10px; }

  .list-item, .player-card {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    background: rgba(255,255,255,0.06); border-radius: 16px; padding: 12px; margin-bottom: 8px;
  }
  .player-name { font-weight: bold; }
  .player-stats { font-size: 11px; color: #aaa; }
  .player-actions { display: flex; gap: 6px; }

  .message-card { background: rgba(255,255,255,0.06); border-radius: 16px; padding: 12px; margin-bottom: 10px; border-left: 3px solid #ffd700; }
  .message-header { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 8px; }
  .message-text { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 12px; margin-bottom: 8px; font-size: 13px; }
  .reply-area { display: flex; gap: 8px; flex-wrap: wrap; }
  .reply-area textarea { flex: 1; min-height: 50px; margin-bottom: 0; }

  .log-entry { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; margin-bottom: 6px; font-size: 12px; }
  .log-player { color: #2ecc71; }

  .search-box input { margin-bottom: 12px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #ffd700; color: #1a1a2e; padding: 10px 20px; border-radius: 50px;
    font-weight: bold; font-size: 13px; z-index: 1000; display: none; white-space: nowrap;
  }
</style>
</head>
<body>

<div class="container">

  <div id="loginScreen" class="login-card">
    <h1>🛠️ Адмін-панель</h1>
    <p>UkrMova Pro — вхід під адмін-акаунтом</p>
    <input type="text" id="loginNick" placeholder="Нікнейм (той самий, що і в грі)">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button id="loginBtn">🔐 Увійти</button>
    <div id="loginError" class="error"></div>
  </div>

  <div id="mainContent" class="main-content">
    <div class="header">
      <h1>👑 Адмін-панель</h1>
      <button class="logout-btn" onclick="logout()">🚪 Вийти</button>
    </div>

    <div class="tabs">
      <button id="tabbtn-tests" class="tab active" onclick="switchTab('tests')">📝 Тести</button>
      <button id="tabbtn-players" class="tab" onclick="switchTab('players')">👥 Гравці</button>
      <button id="tabbtn-support" class="tab" onclick="switchTab('support')">💬 Підтримка</button>
      <button id="tabbtn-results" class="tab" onclick="switchTab('results')">📊 Результати</button>
      <button id="tabbtn-logs" class="tab" onclick="switchTab('logs')">🗒️ Логи</button>
    </div>

    <!-- ТЕСТИ -->
    <div id="panel-tests" class="panel active">
      <h3>Створити новий тест</h3>
      <input type="text" id="newTestName" placeholder="Назва тесту">
      <input type="text" id="newTestCategory" placeholder="Категорія / етап (необов'язково, напр. «Іменники»)">
      <div id="questionsList"></div>
      <button class="btn btn-primary btn-full" onclick="addQuestionRow()">➕ Додати питання</button>
      <button id="saveTestBtn" class="btn btn-success btn-full" onclick="saveTest()">💾 Зберегти тест</button>
      <button class="btn btn-full" style="background:rgba(255,255,255,0.15);color:#eee;" onclick="resetTestForm()">↺ Скасувати редагування / новий тест</button>
      <hr>
      <h3>Наявні тести</h3>
      <div id="testsList"></div>
    </div>

    <!-- ГРАВЦІ -->
    <div id="panel-players" class="panel">
      <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Пошук гравця..." onkeyup="searchPlayers()"></div>
      <div id="playersList"></div>
    </div>

    <!-- ПІДТРИМКА -->
    <div id="panel-support" class="panel">
      <div id="supportList"></div>
    </div>

    <!-- РЕЗУЛЬТАТИ -->
    <div id="panel-results" class="panel">
      <div class="search-box"><input type="text" id="resultsSearch" placeholder="🔍 Пошук за ніком або тестом..." onkeyup="searchResults()"></div>
      <div id="resultsList"></div>
    </div>

    <!-- ЛОГИ -->
    <div id="panel-logs" class="panel">
      <div class="search-box"><input type="text" id="logsSearch" placeholder="🔍 Пошук за ніком..." onkeyup="searchLogs()"></div>
      <div id="logsList"></div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-panel.js"></script>

</body>
</html>
